plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.h.adblockbrowser'
    compileSdk 34

    defaultConfig {
        applicationId "com.h.adblockbrowser"
        minSdk 24
        targetSdk 34
        // QUAN TRỌNG: versionCode PHẢI tăng dần mỗi lần build, nếu không Android sẽ coi "bản
        // mới" là CÙNG PHIÊN BẢN với bản đang cài và có thể ÂM THẦM KHÔNG CÀI ĐÈ được (khiến
        // APK trông như build xong nhưng cài vào máy vẫn là code cũ). Trước đây bị hardcode
        // cứng "1" ở MỌI lần build -> đây là nguyên nhân rất nhiều lần "sửa xong nhưng cài vào
        // vẫn y như cũ". Giờ tự tính theo thời gian build (giây) để luôn tăng dần thật sự.
        def buildVersionCode = ((System.currentTimeMillis() / 1000) as Long).intValue()
        versionCode buildVersionCode
        versionName "1.0." + buildVersionCode
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
}
