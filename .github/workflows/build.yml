name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # SỬA LỖI CI: action "android-actions/setup-android@v3" bị hỏng (Google đã gỡ 1 gói công cụ mà
      # bản v3 còn đòi - tác giả vá ở v4.0.2) nên bước này fail ngay sau ~10 giây, KHÔNG liên quan
      # tới code của app (bước build còn chưa kịp chạy). Thay bằng tự tải "cmdline-tools" THẲNG TỪ
      # GOOGLE, không phụ thuộc action bên thứ 3 - cách này đã chạy ổn ở repo "key".
      - name: Set up Android SDK (tải thẳng cmdline-tools từ Google)
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Accept SDK licenses + cài platform 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          build_exit=$?
          set -e
          echo "" >> build.log
          echo "=== APK thực tế tìm thấy sau build (find app/build/outputs -iname '*.apk') ===" >> build.log
          find app/build/outputs -iname "*.apk" >> build.log 2>&1 || echo "(khong tim thay file .apk nao)" >> build.log
          echo "build_exit=$build_exit" >> $GITHUB_OUTPUT

      - name: Save build log to repo (via API)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64 -w0 build.log > /tmp/b64.txt
          curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/build-logs/last-build.log?ref=main" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha','') if isinstance(d, dict) else '')" > /tmp/sha.txt
          python3 -c "import json; sha=open('/tmp/sha.txt').read().strip(); c=open('/tmp/b64.txt').read().strip(); d={'message':'chore: cap nhat build log [skip ci]','content':c,'branch':'main'}; d.update({'sha':sha} if sha else {}); print(json.dumps(d))" > /tmp/body.json
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/contents/build-logs/last-build.log" -d @/tmp/body.json -w "\nHTTP_STATUS:%{http_code}\n"

      - name: Dừng job nếu build thật sự thất bại
        if: steps.build.outputs.build_exit != '0'
        run: |
          echo "Build failed with exit code ${{ steps.build.outputs.build_exit }}"
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          # Rộng hơn "apk/debug/*.apk" cũ - phòng trường hợp cấu trúc thư mục output đổi khác
          # (đổi build variant, thêm flavor...) khiến đường dẫn cũ không còn khớp NỮA mà không
          # ai biết (trước đây action âm thầm "success" dù 0 file khớp - xem if-no-files-found).
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
